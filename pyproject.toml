[project]
name = "forest-watch"
version = "0.1.0"
description = "Sentinel-2 forest cover segmentation project scaffold"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "rasterio>=1.3", "torch>=2.1", "torchvision>=0.16",
  "segmentation-models-pytorch>=0.3.3", "albumentations>=1.4",
  "scikit-learn>=1.3", "matplotlib>=3.7", "tqdm>=4.66", "pyyaml>=6.0",
  "folium>=0.15", "shapely>=2.0", "pyproj>=3.6", "pillow>=10"
]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
